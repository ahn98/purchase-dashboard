<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 물품구매 관리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-brand">
        <span class="brand-seal big" aria-hidden="true">購</span>
        <div>
          <p class="login-org" id="org-name"></p>
          <h1 class="login-title" id="site-name"></h1>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab active" data-tab="login" aria-selected="true">로그인</button>
        <button type="button" role="tab" class="tab" data-tab="signup" aria-selected="false">회원가입</button>
      </div>

      <form id="login-form" class="stack" novalidate>
        <label class="field">
          <span>이메일</span>
          <input type="email" name="email" autocomplete="email" required placeholder="name@agency.go.kr">
        </label>
        <button type="submit" class="btn btn-primary btn-block">로그인 링크 받기</button>
        <p class="hint">비밀번호 없이 메일로 받은 링크를 눌러 로그인합니다.</p>
      </form>

      <form id="signup-form" class="stack" novalidate hidden>
        <label class="field">
          <span>실명</span>
          <input type="text" name="full_name" autocomplete="name" required placeholder="홍길동">
        </label>
        <label class="field">
          <span>이메일</span>
          <input type="email" name="email" autocomplete="email" required placeholder="name@agency.go.kr">
        </label>
        <button type="submit" class="btn btn-primary btn-block">가입 신청하기</button>
        <p class="hint">메일 인증 후 최고관리자가 승인하면 이용할 수 있습니다.</p>
      </form>

      <div id="sent-box" class="sent-box" hidden></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
